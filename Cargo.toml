[package]
name = "encoder"
version = "0.2.5"
edition = "2021"
authors = ["Jian Chen <admin@chensoft.com>"]
license = "MIT"
description = "A blazing-fast encoder writing to a contiguous buffer"
documentation = "https://docs.rs/encoder"
repository = "https://github.com/chensoft/encoder"
readme = "README.md"
keywords = ["encode", "encoding", "number", "json", "contiguous"]

[dependencies]
ryu = "1.0"
indexmap = "2.2"
simd-json = "0.13"
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "number"
harness = false

[[bench]]
name = "json"
harness = false
